name: census

# Manual only: one run costs roughly 15k RPC credits, and the live site shares the same key.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - name: Scan every DBC transfer-hook pool on mainnet
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          CONCURRENCY: "3"
        run: bun scripts/index.ts
      - name: Commit the snapshot
        run: |
          git config user.name "hookscan-census"
          git config user.email "census@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet || git commit -m "census: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

[package]
name = "hookguard"
version = "0.1.0"
edition = "2021"
description = "On-chain guard for Meteora DBC transfer-hook trades: reverts if a hook changed since it was attested"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = "=0.9.3"
pinocchio-system = "=0.4.0"
pinocchio-pubkey = "=0.3.0"

[dev-dependencies]
mollusk-svm = "0.14.0"
solana-account = "4.3.1"
solana-instruction = "3.4.0"
solana-pubkey = "4.2.0"
solana-program-error = "3.0.1"
solana-clock = "3.1.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
